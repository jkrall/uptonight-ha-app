name: "UpTonight"
version: "0.1.7"
slug: "uptonight"
description: "Calculates the best observable deep sky objects for your location."
arch:
  - amd64
  - aarch64
  - armv7
init: false
options:
  longitude: ""
  latitude: ""
  elevation: ""
  timezone: ""
  observatory_name: ""
  pressure: ""
  relative_humidity: ""
  temperature: ""
  observation_date: ""
  target_list: ""
  type_filter: ""
  output_dir: "/homeassistant/www/uptonight"
  live_mode: ""
  target: ""
  features:
    - objects
    - bodies
  horizon:
    step_size: 5
    anchor_points: []
schema:
  longitude: "str?"
  latitude: "str?"
  elevation: "str?"
  timezone: "str?"
  observatory_name: "str?"
  pressure: "str?"
  relative_humidity: "str?"
  temperature: "str?"
  observation_date: "str?"
  target_list: "str?"
  type_filter: "str?"
  output_dir: "str?"
  live_mode: "str?"
  target: "str?"
  features:
    - "list(horizon|objects|bodies|comets|alttime)?"
  horizon:
    step_size: "int(1,180)?"
    anchor_points:
      - az: "float(0,360)"
        alt: "float(-90,90)"
map:
  - homeassistant_config:rw
